name: validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python3 - <<'EOF'
          import json
          m = json.load(open('SafeCrabPots/manifest.json'))
          assert m["Name"] == "Safe Crab Pots", m
          assert m["Author"] == "Markentyy", m
          assert m["UniqueID"] == "Markentyy.SafeCrabPots", m
          assert m["EntryDll"] == "SafeCrabPots.dll", m
          assert "ContentPackFor" not in m, "C# mods must not declare ContentPackFor"
          print("manifest OK")
          EOF

      - name: Validate changelog has 1.0.0 entry
        run: grep -q "## \[1.0.0\]" CHANGELOG.md && echo "changelog OK"
